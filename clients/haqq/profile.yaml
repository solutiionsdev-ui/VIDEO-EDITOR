# Client profile. Rules and the feedback log at the bottom are grown by every revision.
client:
  name: HAQQ.AI
  slug: haqq
  contact: ''
  languages:
  - en
  - ar
  onboarded: '2026-11-01'
brand:
  logo: assets/logo.webp
  logo_dark: assets/logo-white.webp
  colours:
    primary: '#66023C'
    secondary: '#002C6C'
    accent: '#FFFFFF'
  fonts:
    primary:
      file: assets/fonts/Poppins-SemiBold.ttf
      licence: SIL Open Font License
  tone: Confident, clear, lawyer-grade precision without the jargon. Poppins only.
style:
  name: ios
  tweaks:
  - captions 10% larger
  - white-card layout max 40% of beats
captions:
  font: Poppins
  size_px: 70
  colour: '#FFFFFF'
  active_word_colour: '#66023C'
  position: lower-third
  max_words_per_line: 4
  language_rules:
  - Arabic right-to-left
  - English words kept in Latin script
graphics_library:
- HAQQ notification card
- contract-risk badge
music:
  moods:
  - minimal electronic
  bpm: 100-110
  tracks: []
  ducking_db: -18
format:
  aspect: '9:16'
  max_length_s: 60
  intro: ''
  outro: logo end card 1.5 s
  cta: ''
  safe_zones: instagram
rules:
  do:
  - 'consumer copy talks about understanding a document: understand, review, check the sources, know what
    to ask, know what you''re signing'
  - hook in the first 1-3 seconds; one message per video
  dont:
  - never cut jokes
  - never show competitor names
  - never invent HAQQ screens or interface text; product UI only from supplied assets
  - 'never say: is this legal, can they do this, you should, what are my rights, you don''t need a lawyer'
editing:
  breath: 0.12
  max_pause: 0.45
  remove_fillers: true
  take_preference: last
transcription:
  language: auto
  vocabulary:
  - HAQQ
  - HAQQ.AI
  - Justinian
feedback_log:
- date: '2026-11-02'
  comment: 'beat 4: captions bigger'
  rule: captions 12% bigger on beat 4
  scope: beat 4
  job: test
- date: '2026-11-03'
  comment: 0:45 move the graphic down
  rule: graphic at the bottom
  scope: beat 12
  job: test
review:
  studiio_review: true
  reviewed_jobs: 0
  review_until_jobs: 10
