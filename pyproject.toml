[project]
name = "studiio-reel-editor"
version = "0.1.0"
description = "Studiio Reel Editor — the editing engine (Phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2",
    "mediapipe>=1.2",
    "opencv-contrib-python>=4.10",
    "imageio-ffmpeg>=0.7",
    "numpy>=2",
    "pyyaml>=6",
    "rich>=13",
    "anthropic>=1.0",
    "jsonschema>=4",
    "playwright>=1.50",
    "pillow>=10",
]

[project.scripts]
reel = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
