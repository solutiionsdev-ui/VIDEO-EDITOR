# Explainer — the third style in the library, rebuilt on 2026-11-06 to follow its reference closely.
#
# Look: a product explainer in motion graphics. Pure black and pure white stages, one vivid colour
# (the client's), Inter set tight. The spoken words are the text on screen: a line starts large and
# snaps back as words join, a short highlight is a solid chip, a number in a chip counts up, a payoff
# line is typed behind a thick cursor. What is being talked about is shown in white panels with a
# hairline and a long shadow: numbers in a dark band, rows with a thin line that fills, a chain of
# steps the camera travels along, a notification over the colour rising from below, the client's own
# screens in a window. A scene ends when its last chip grows into the whole frame. The reel closes
# on a dot inside expanding rings that shrinks into the mark while the name is typed.
#
# This file is the contract between the beat planner (stage 7) and the renderer (stages 8/10).
# The look is in components.css; the moves are in components.js; the typeface is in fonts/.

name: explainer
title: Explainer
version: 2                 # bumped on every published change; jobs record the version they were planned with
status: published          # draft | published | retired
made_for: [talking-head, infographic]   # infographic: has charts and a stage where the words are the picture
reference: "A motion-graphics product explainer: tight grotesque type, chips, panels with hairlines, a chain of steps the camera travels along, rings around a dot at the end. Studied frame by frame for its type, proportions and moves; none of its content (name, screens, footage, wording) is reused."

type:                      # the style's own typeface; a client keeps its own font with style.type: client in its profile
  family: Inter
  file: fonts/Inter.ttf
  licence: "SIL Open Font License 1.1 — fonts/OFL.txt"

planning: >
  In this style the words are the picture on a stage: most stage beats need no component at all, only
  good highlight_words. One or two highlight words that sit together become a solid chip (use this
  for the word that carries the line, and for a number: a number in a chip counts up); three or more
  together are set in the colour without a chip (use this for a phrase). Caption style "emphasis"
  types the line letter by letter: keep it for the hook and the payoff. Alternate the stages:
  "stage-dark" for the hook, the question, a turn and the brand moment; "stage-light" whenever a
  component shows something, and for plain statements between them. Components: several numbers at
  once → stats; one number → stat; a few things compared → bars; steps, a funnel, a process → flow
  (give each arrow its rate only when the rates are said); a message, a booking, a payment → note;
  one share of a whole → donut; two numbers against each other → versus; one of the client's screens
  → screen (say where to push in with focus); a single word or name that should come through the
  frame, once a reel, on "stage-dark" → title. Show the speaker with "face-full" for the opening
  line, a personal claim and the closing ask, and with "frame" when a component should sit under the
  face. Change layout every 1–3 beats. Never invent a screen: screen and asset only with a file from
  the client visuals list.

layouts:
  face-full:
    description: >
      The footage fills the frame. Captions sit in the lower third, the key word in a chip. One
      component may float above the face. For the opening line, a personal claim, the closing ask.
    graphic_anchors: [top, bottom]
  stage-dark:
    kind: stage
    description: >
      No footage: a pure black stage. The spoken words are the text, white, large and centred. For
      the hook, the question, a turn, the brand moment.
    bg_class: stage-dark
    caption_theme: dark
    zone: { top: 0.215, bottom: 0.76 }            # where a component sits, when there is one
    captions: { top: 0.075, bottom: 0.20 }        # the words, above a component
    captions_solo: { top: 0.30, bottom: 0.62 }    # the words alone, in the middle of the frame
    graphic_anchors: [center]
    max_share: 0.45
  stage-light:
    kind: stage
    description: >
      No footage: a pure white stage. For anything a component shows, with the spoken words above
      it, and for plain statements in black type.
    bg_class: stage-light
    caption_theme: light
    zone: { top: 0.215, bottom: 0.76 }
    captions: { top: 0.075, bottom: 0.20 }
    captions_solo: { top: 0.30, bottom: 0.62 }
    graphic_anchors: [center]
    max_share: 0.50
  frame:
    kind: card
    description: >
      The footage sits in a rounded frame on the white stage, a component below it, captions under.
      For a claim the speaker should be seen making while a component proves it.
    footage_card: { x: 0.25, y: 0.065, w: 0.50, h: 0.40, radius: 44 }
    bg_class: stage-light
    caption_theme: light
    captions_solo: { top: 0.50, bottom: 0.68 }    # with no component, the words sit right under the frame
    graphic_anchors: [below-card]
    max_share: 0.30

components:
  stats:
    description: Two to four numbers in a dark band, each large and light with a short label, counting up as it is said. With a title it sits in a white panel like a report. For the headline figures of something. Every number must be in the script.
    props: { title: "optional, 1-3 words", sub: "optional, up to 8 words", items: "list of 2-4 {value: a number with its unit, label: 1-3 words}" }
    text_fields: [title, sub, items]
    max_words: 24
    count: { field: items, min: 2, max: 4 }
    still: end
  stat:
    description: One big light number in a dark band with a short label, counting up. For a single result, a sum, a percentage.
    props: { value: "e.g. $800,000 or 40%", label: "2-4 words" }
    text_fields: [value, label]
    still: end
  bars:
    description: Two to five rows in a white panel, each a label, its value and a thin line that fills. The row lifts out with a glow while its figure is said. For a few things compared — shares, counts, rates. Every label and value must be in the script.
    props: { title: "optional, 1-4 words", sub: "optional, up to 8 words", items: "list of 2-5 {label: 1-3 words, value: a number with its unit, e.g. 48%}" }
    text_fields: [title, sub, items]
    max_words: 30
    count: { field: items, min: 2, max: 5 }
    still: end
  flow:
    description: A chain of two to five steps as black pills joined by tiles in the client's colour; the camera travels along it as each step is said. A step that starts with a number shows the number bright and the rest grey ("2,700 clicks"). Each tile may carry the rate between two steps, only when the rates are said. For a funnel, a process, a journey.
    props: { steps: "list of 2-5 steps, each 1-3 words, e.g. '2,700 clicks'", rates: "optional list, one per arrow, e.g. 6.5%" }
    text_fields: [steps, rates]
    max_words: 20
    still: end
  note:
    description: A notification — a title and one short line on glass, while the client's colour rises behind it. For a message, a booking, a payment, a request.
    props: { title: "1-3 words", body: "short line, up to 6 words" }
    text_fields: [title, body]
    max_words: 9
  donut:
    description: One percentage as a thin ring that turns into place and fills, the number light and large in the middle, a short label under it. For a single share of a whole.
    props: { value: "a percentage, e.g. 64%", label: "2-5 words" }
    text_fields: [value, label]
    max_words: 7
    still: end
  versus:
    description: Two numbers side by side with an arrow between them, the first on a white panel, the second in a dark band. For before and after, short and long, one group against another.
    props: { sides: "list of exactly 2 {label: 1-3 words, value: a number with its unit}" }
    text_fields: [sides]
    max_words: 10
    count: { field: sides, min: 2, max: 2 }
    still: end
  title:
    description: One word or a name, huge, coming through the frame out of a blur and gone again. Only on stage-dark, at most once a reel, for the moment a name or the answer arrives. The word must be said in that beat.
    props: { text: "1-2 words" }
    text_fields: [text]
  screen:
    description: One of the client's own screens (a product screenshot) in a window. The view pushes slowly towards one part of it while a cursor glides there and clicks. Only a file from the client visuals list; never an invented screen.
    props: { file: "a file name from the client visuals list", focus: "optional: where to push in — top-left | top | top-right | left | center | right | bottom-left | bottom | bottom-right" }
    text_fields: []
  asset:
    description: A visual the client supplied that is not a product screen — a chart, a photo — as a card, with an optional short caption. Only files listed as client visuals.
    props: { file: "a file name from the client visuals list", caption: "optional, 1-4 words" }
    text_fields: [caption]
  logo-end-card:
    description: The end. A dot in the client's colour inside expanding rings shrinks into the mark - the client's logo, or the dot and the client's name typed beside it when there is no logo file - then the call to action pops in as a chip. Only for the last beat.
    props: { cta: "optional, 2-6 words" }
    text_fields: [cta]

captions:
  mode: word-by-word          # each word arrives as it is said; an emphasis line is typed letter by letter behind a cursor
  max_words_per_line: 4
  max_lines: 2
  position: "stages: centred, alone in the middle or above a component; face-full and frame: lower third"
  styles:
    normal: Inter medium, set tight; a new word is born in the colour (grey on white) and settles
    emphasis: Inter semibold, typed letter by letter behind a thick cursor; for the hook and the payoff only
  highlight: one or two words together sit in a solid chip of the client's colour (a number counts up); three or more are set in the colour
  arabic: right-to-left, English words kept in Latin script

motion:
  widget_in: "a panel rises 150 px out of a blur and settles, 350 ms; the view keeps pushing in 3.5% over the beat"
  widget_out: "fade and sink, 200 ms"
  widget_hold: "1.5-4 s; at most one component on screen at a time"
  layout_switch: "flare: the last chip of the scene (or its cursor) grows into a pill and then the whole frame in the client's colour, 300 ms; the next scene opens out of it through a closing circle, 420 ms"
  first_beat: "the reel opens out of black; no component in the first 0.4 s"
  captions: "a line frames what has been said: 1.85x while one or two words stand, a step back when the next word needs room, and it keeps easing back while it holds"
  screen: "a push-in of about 30% towards the focus over the beat; the cursor arrives after 1.2 s and clicks"
  end_card_s: 3.4            # rings 1.2 s, the dot lands, the name is typed, the chip pops

rules:
  - The spoken words are the text on screen; a component adds proof, it never repeats the words.
  - At most 5 words of graphic text on screen at once, unless the component's own entry gives a max_words (captions and the words inside a client's screen do not count).
  - One component at a time.
  - Graphics must never cover the no-go box from face.json.
  - Never invent product screens or interface text. Product UI only from the client's assets.
  - One colour: the client's (brand.colours.primary), lifted on black when it would be too dark. Stages are pure black and pure white. Type is white on black, near-black on white.
  - Numbers, names and quotes in a graphic must come from what is said in that beat or the client's brief, never made up.
  - No logos, wording or icons of other companies. The reference was studied for its type, proportions and moves only.
